# OneBlock phases.
#
# natural: unlock in order as the island breaks blocks. starts-at = total blocks broken when it unlocks.
#          When a new phase unlocks the OneBlock switches to it; players can switch back to any unlocked
#          phase in /is phases (e.g. to farm ores in Underground).
# bonus:   bought in /is phases with coins OR cogs, once the "requires" phase is unlocked.
#
# blocks / mobs: name: weight (weight 20 is twice as likely as weight 10).
# mob-chance / chest-chance: chance per block broken (0.03 = 3%).
# loot-table: vanilla loot table used for chests (see the Minecraft wiki "Loot table" page).
# sequence: (natural phases) fixed blocks at the start of the phase, in order, before random ones.
#           CHEST in the list = a loot chest. Plains' first entry is a new island's first block.
#
# starter-chest: exact items in the first CHEST of the sequence (instead of random loot).
# chest-extras: extra items that can show up in this phase's chests: ITEM: [chance, min, max].
# bonus-drops: extra drops when the OneBlock breaks: BLOCK: {ITEM: chance}.
#
# Avoid blocks that break the OneBlock by themselves: leaves (decay), ice (melts), flowers/cactus/sugar cane
# (need support). Falling blocks like sand are fine - the OneBlock never falls.

